<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ESP32 - Semaforo Inteligente</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: #f4f4f7;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
        margin: 0;
        padding: 2rem 1rem;
      }
      .card {
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        padding: 2rem;
        max-width: 480px;
        width: 100%;
      }
      h1 {
        margin: 0 0 1.5rem;
        font-size: 1.4rem;
        text-align: center;
        color: #222;
      }
      .semaforo {
        background: #222;
        width: 110px;
        margin: 0 auto 1rem;
        padding: 1rem 0;
        border-radius: 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.9rem;
      }
      .luz {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: #3a3a3a;
        transition: background 0.15s ease, box-shadow 0.15s ease;
      }
      .luz.vermelho.on {
        background: #e74c3c;
        box-shadow: 0 0 24px 6px rgba(231, 76, 60, 0.8);
      }
      .luz.amarelo.on {
        background: #f1c40f;
        box-shadow: 0 0 24px 6px rgba(241, 196, 15, 0.8);
      }
      .luz.verde.on {
        background: #2ecc71;
        box-shadow: 0 0 24px 6px rgba(46, 204, 113, 0.8);
      }
      .fase {
        text-align: center;
        font-weight: 700;
        font-size: 1.1rem;
        margin-bottom: 1rem;
        color: #222;
      }
      .botao {
        width: 100%;
        padding: 0.9rem;
        border: none;
        border-radius: 8px;
        background: #2980b9;
        color: #fff;
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
      }
      .botao:hover {
        background: #1f6391;
      }
      .info {
        display: flex;
        justify-content: space-between;
        font-size: 0.9rem;
        color: #555;
        margin: 1.25rem 0 0.5rem;
      }
      .info .val {
        font-weight: 700;
        color: #222;
        font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
      }
      input[type="range"] {
        width: 100%;
        height: 2rem;
        cursor: pointer;
        accent-color: #2980b9;
      }
      .output h2 {
        font-size: 0.85rem;
        text-transform: uppercase;
        color: #666;
        margin: 1.25rem 0 0.35rem;
        letter-spacing: 0.05em;
      }
      .output pre {
        background: #1e1e1e;
        color: #e8e8e8;
        font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
        font-size: 0.9rem;
        padding: 0.8rem;
        border-radius: 6px;
        margin: 0;
        min-height: 1.5em;
        white-space: pre-wrap;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Semaforo Inteligente</h1>

      <div class="semaforo">
        <div class="luz vermelho" id="luzVermelho"></div>
        <div class="luz amarelo" id="luzAmarelo"></div>
        <div class="luz verde" id="luzVerde"></div>
      </div>

      <div class="fase" id="faseTxt">--</div>

      <button class="botao" id="btnPedestre">Solicitar travessia (pedestre)</button>

      <div class="info">
        <span>LDR: <span class="val" id="ldrVal">0</span> / <span id="adcMax">4095</span></span>
        <span>Noite: <span class="val" id="noiteVal">--</span></span>
      </div>

      <div class="info" style="margin-top: 1rem">
        <label for="limiar">Limiar do modo noturno</label>
        <span class="val" id="limiarVal">1500</span>
      </div>
      <input id="limiar" type="range" min="0" max="4095" value="1500" />

      <div class="output">
        <h2>Ultima resposta (/status)</h2>
        <pre id="respOut"></pre>
      </div>
    </div>

    <script>
      const ESP_BASE = "http://192.168.4.1";

      const luzVermelho = document.getElementById("luzVermelho");
      const luzAmarelo = document.getElementById("luzAmarelo");
      const luzVerde = document.getElementById("luzVerde");
      const faseTxt = document.getElementById("faseTxt");
      const ldrVal = document.getElementById("ldrVal");
      const adcMax = document.getElementById("adcMax");
      const noiteVal = document.getElementById("noiteVal");
      const respOut = document.getElementById("respOut");

      let piscaNoturno = false; // alterna o amarelo no modo noturno

      function pintar(fase) {
        luzVermelho.classList.remove("on");
        luzAmarelo.classList.remove("on");
        luzVerde.classList.remove("on");

        if (fase === "VERMELHO") luzVermelho.classList.add("on");
        else if (fase === "VERDE") luzVerde.classList.add("on");
        else if (fase === "AMARELO") luzAmarelo.classList.add("on");
        else if (fase === "NOTURNO") {
          // pisca o amarelo a ~1 Hz no cliente
          piscaNoturno = !piscaNoturno;
          if (piscaNoturno) luzAmarelo.classList.add("on");
        }
      }

      // --- Polling do status (>= 1 Hz; usamos 2 Hz) ---
      async function atualizar() {
        try {
          const r = await fetch(`${ESP_BASE}/status`);
          const data = await r.json();

          ldrVal.textContent = data.ldr;
          adcMax.textContent = data.adcMax;
          noiteVal.textContent = data.noite ? "sim" : "nao";
          faseTxt.textContent = data.fase;
          pintar(data.fase);

          respOut.textContent = JSON.stringify(data, null, 2);
        } catch (e) {
          respOut.textContent = `Erro: ${e.message}`;
        }
      }
      setInterval(atualizar, 500);
      atualizar();

      // --- Botao de pedestre (alem do botao fisico por interrupcao) ---
      document.getElementById("btnPedestre").addEventListener("click", async () => {
        try {
          const r = await fetch(`${ESP_BASE}/pedestre`);
          respOut.textContent = `HTTP ${r.status}\n${await r.text()}`;
        } catch (e) {
          respOut.textContent = `Erro: ${e.message}`;
        }
      });

      // --- Ajuste do limiar ---
      const limiar = document.getElementById("limiar");
      const limiarValTxt = document.getElementById("limiarVal");
      let timer = null;
      limiar.addEventListener("input", () => {
        limiarValTxt.textContent = limiar.value;
        clearTimeout(timer);
        timer = setTimeout(async () => {
          try {
            await fetch(`${ESP_BASE}/limiar?val=${limiar.value}`);
          } catch (e) {
            respOut.textContent = `Erro: ${e.message}`;
          }
        }, 80);
      });
    </script>
  </body>
</html>
